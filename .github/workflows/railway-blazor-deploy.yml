name: Deploy Blazor to Railway

on:
  push:
    branches:
      - ProjectoCompartido
    paths:
      - 'AutoPartsAP1/**'
      - 'AutoParts.Shared/**'
      - 'Dockerfile.blazor'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service autoparts-blazor --dockerfile Dockerfile.blazor
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
